name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Scaffolded (Next.js 16): run guards when package.json exists.
      - name: Typecheck (when scaffolded)
        run: |
          if [ -f package.json ]; then pnpm install --frozen-lockfile && pnpm typecheck; else echo "no frontend code yet — skipping"; fi
      - name: Lint (when scaffolded)
        run: |
          if [ -f package.json ]; then pnpm lint; else echo "no frontend code yet — skipping"; fi
      - name: Tests (when scaffolded)
        run: |
          if [ -f package.json ]; then pnpm test; else echo "no frontend code yet — skipping"; fi
